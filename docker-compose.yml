# Mirrors production topology (Neon Postgres / Upstash Redis / Cloudflare R2)
# with local equivalents so `docker compose up` gives a full working stack.
# Copy .env.example -> .env before `docker compose up api` (the api service reads it).

services:
  postgres:
    image: postgres:16-alpine
    container_name: mars_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mars
      POSTGRES_PASSWORD: mars_dev_password
      POSTGRES_DB: mars_dev
    ports:
      - "55432:5432"  # host 5432 AND 5433 are both taken by native Windows Postgres services (16, 18) on this machine — see documentation/AIMS/mistakes.md (milestone/m2-kermt)
    volumes:
      - mars_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars -d mars_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mars_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest  # docker.io/minio/minio now requires `docker login` for anonymous pulls — see documentation/AIMS/mistakes.md (milestone/m2-kermt)
    container_name: mars_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mars_minio
      MINIO_ROOT_PASSWORD: mars_minio_password
    ports:
      - "9000:9000"   # S3-compatible API (stands in for R2)
      - "9001:9001"   # web console
    volumes:
      - mars_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: mars_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://mars:mars_dev_password@postgres:5432/mars_dev
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app
      - ./contracts:/contracts
      - ./ml/artifacts:/app/ml/artifacts
      - ./ml/data/cache:/app/ml/data/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # KERMT Tier-0 inference (CPU). OPT-IN: `docker compose --profile kermt up -d kermt`; a plain
  # `docker compose up` does not start it, and the api serves every endpoint from XGBoost until
  # KERMT_SERVICE_URL=http://kermt:8100 is set for it (.env). Needs the checkpoints fetched first:
  #   cd ml && PYTHONPATH=. .venv/Scripts/python serve/kermt_service/fetch_artifacts.py
  # Memory is about 0.25 GB per checkpoint plus 0.8 GB for torch; KERMT_SEEDS picks how many
  # seeds per arm to load (3 of 5 -> about 4.5 GB for the five arms the routing table uses).
  kermt:
    profiles: ["kermt"]
    build:
      context: .
      dockerfile: ml/serve/kermt_service/Dockerfile
    container_name: mars_kermt
    restart: unless-stopped
    environment:
      KERMT_ARMS: ${KERMT_ARMS:-toxicity__cls,metabolism__cls,metabolism__reg,absorption_distribution__cls,absorption_distribution__reg}
      KERMT_SEEDS: ${KERMT_SEEDS:-0,1,2}
      KERMT_TOKEN: ${KERMT_SERVICE_TOKEN:-}
    volumes:
      - ./ml/artifacts_kermt:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

volumes:
  mars_postgres_data:
  mars_minio_data:
