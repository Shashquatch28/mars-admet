name: CI

# CI/CD (blueprint Module 10):
#   - lint + test on PR (incl. real Postgres/Redis service containers for
#     Module 13 auth/persistence + Module 8 batch integration tests)
#   - build the API image (now includes the real ml/serve/ inference stack)
#   - smoke-test a known-molecule /predict to catch silent regressions
#     (ties into Module 11's reproducibility discipline)
# Deploy-on-merge is intentionally NOT wired here yet — actual Cloud Run
# deployment needs GCP_SA_KEY_JSON + explicit maintainer approval before any
# push-to-a-live-service happens (M3/M10, tracked in next_steps.md), not a
# silent CI addition.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      # Module 13 auth/persistence + Module 8 batch tests need real Postgres +
      # Redis — they skip gracefully without this (see api/tests/conftest.py's
      # requires_infra), but CI should actually exercise them, not just the
      # stub-only fast tier.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars_dev_password
          POSTGRES_DB: mars_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mars -d mars_dev"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://mars:mars_dev_password@localhost:5432/mars_dev
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install contracts + API + tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ./contracts
          pip install -r api/requirements.txt
          pip install pytest ruff httpx

      - name: Lint (ruff)
        run: ruff check contracts api ml

      - name: Apply DB migrations
        working-directory: api
        run: alembic upgrade head

      - name: Test contracts
        run: pytest contracts/tests -q

      - name: Test API (incl. auth/persistence/batch integration tests)
        run: pytest api/tests -q

  smoke-predict:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./contracts
          pip install -r api/requirements.txt

      - name: Boot API and smoke-test /predict on a known molecule
        working-directory: api
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          resp=$(curl -sf -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"smiles": "CCO", "endpoints": null}')
          echo "$resp"
          echo "$resp" | python -c "import sys, json; d = json.load(sys.stdin); assert len(d['predictions']) == 14, d; assert d['model_version'], d; print('smoke OK:', len(d['predictions']), 'predictions,', 'model_version=' + d['model_version'])"

  build-api-image:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f api/Dockerfile -t mars-api:ci .
